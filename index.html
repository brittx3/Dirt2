<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Studio: Live Platformer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --ui-bg: rgba(20, 20, 20, 0.9); --ui-border: #444; --accent: #2e7d32; --text: #eee; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: var(--text); user-select: none; }
        #hud { position: absolute; top: 20px; left: 20px; width: 280px; background: var(--ui-bg); backdrop-filter: blur(10px); border: 1px solid var(--ui-border); border-radius: 12px; padding: 20px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #888; margin-bottom: 10px; display: block; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .id-container { background: #111; border: 1px solid #444; border-radius: 6px; padding: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        #my-id-display { font-family: monospace; font-size: 12px; color: #4caf50; }
        .copy-btn { background: #444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        .btn { background: #333; border: 1px solid var(--ui-border); color: white; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .btn.active { background: var(--accent); border-color: #4caf50; }
        .char-select { display: flex; gap: 10px; margin-bottom: 15px; }
        .char-btn { flex: 1; font-size: 20px; padding: 10px; background: #222; border: 2px solid #444; border-radius: 10px; cursor: pointer; }
        .char-btn.selected { border-color: #ffd54f; background: #333; }
        canvas { display: block; background: linear-gradient(to bottom, #1e3c72, #2a5298); cursor: crosshair; }
        .hint { font-size: 9px; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div id="hud">
    <div class="id-container">
        <span id="my-id-display">Connecting...</span>
        <button class="copy-btn" onclick="copyId()">COPY</button>
    </div>
    
    <div style="display:flex; gap:5px; margin-bottom:15px;">
        <input type="text" id="peer-id-input" placeholder="Andrey's ID" style="flex:1; background:#111; border:1px solid #444; color:white; padding:8px; border-radius:6px; font-size:11px;">
        <button class="btn" onclick="connectToPeer()">LINK</button>
    </div>

    <span class="section-label">Choose Your Character</span>
    <div class="char-select">
        <button class="char-btn" id="btn-cat" onclick="selectChar('🐱')">🐱</button>
        <button class="char-btn" id="btn-dog" onclick="selectChar('🐶')">🐶</button>
    </div>

    <span class="section-label">Materials</span>
    <div class="grid-3">
        <button class="btn" onclick="setEl('wood')">Wood</button>
        <button class="btn" onclick="setEl('tree')">Sapling</button>
        <button class="btn" onclick="setEl('grass')">Grass</button>
        <button class="btn" onclick="setEl('flower')">Flower</button>
        <button class="btn" onclick="setEl('water')">Water</button>
        <button class="btn" onclick="setEl('lava')">Lava</button>
    </div>
    <button class="btn" style="width:100%; background:#833" onclick="resetCanvas()">PURGE WORLD</button>
    <div class="hint">CONTROLS: ARROWS/WASD & SPACE (Double Jump)</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const colors = {
        wood: ['#3e2723'], tree: ['#1b5e20'], grass: ['#2e7d32'],
        flower: ['#f06292', '#ba68c8'], water: ['#01579b'], lava: ['#bf360c'],
        fire: ['#ff5722'], smoke: ['#666']
    };

    let width = 180, grid, cellSize, height, myId, peer, conn;
    let currentElement = 'wood', birds = [], smoke = [];
    
    // Player Physics
    let player = { x: 50, y: 50, vx: 0, vy: 0, char: '🐱', jumps: 0, w: 20, h: 20 };
    let partner = { x: -100, y: -100, char: '🐶' };
    const keys = {};

    function setup() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        cellSize = canvas.width / width; height = Math.floor(canvas.height / cellSize);
        grid = Array.from({ length: width }, () => new Array(height).fill(0));
    }

    function selectChar(c) {
        player.char = c;
        document.getElementById('btn-cat').classList.toggle('selected', c === '🐱');
        document.getElementById('btn-dog').classList.toggle('selected', c === '🐶');
    }

    function copyId() { navigator.clipboard.writeText(myId); }

    peer = new Peer();
    peer.on('open', id => { myId = id; document.getElementById('my-id-display').innerText = id; });
    peer.on('connection', c => {
        conn = c;
        conn.on('data', d => {
            if (d.type === 'grid') grid[d.x][d.y] = d.v;
            if (d.type === 'pos') { partner.x = d.x; partner.y = d.y; partner.char = d.char; }
        });
    });

    function connectToPeer() {
        conn = peer.connect(document.getElementById('peer-id-input').value);
        conn.on('data', d => {
            if (d.type === 'grid') grid[d.x][d.y] = d.v;
            if (d.type === 'pos') { partner.x = d.x; partner.y = d.y; partner.char = d.char; }
        });
    }

    window.onkeydown = e => {
        keys[e.code] = true;
        if (e.code === 'Space' && player.jumps < 2) {
            player.vy = -7;
            player.jumps++;
        }
    };
    window.onkeyup = e => keys[e.code] = false;

    function update() {
        // Sand Physics
        let next = grid.map(col => [...col]);
        for (let x = 0; x < width; x++) {
            for (let y = height - 1; y >= 0; y--) {
                let type = grid[x][y]; if (!type) continue;
                if (colors.wood.includes(type) || colors.tree.includes(type)) continue;
                if (y < height - 1 && !grid[x][y+1]) { next[x][y+1] = type; next[x][y] = 0; }
            }
        }
        grid = next;

        // Player Movement
        if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -4;
        else if (keys['ArrowRight'] || keys['KeyD']) player.vx = 4;
        else player.vx *= 0.8;

        player.vy += 0.4; // Gravity
        player.x += player.vx;
        player.y += player.vy;

        // Collision with Grid
        let gx = Math.floor(player.x / cellSize);
        let gy = Math.floor((player.y + player.h) / cellSize);
        
        if (gx >= 0 && gx < width && gy >= 0 && gy < height && grid[gx][gy]) {
            player.y = gy * cellSize - player.h;
            player.vy = 0;
            player.jumps = 0;
        }

        // Keep in bounds
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;
        if (player.y > canvas.height) { player.x = 100; player.y = 0; }

        if (conn && conn.open) conn.send({ type: 'pos', x: player.x, y: player.y, char: player.char });
    }

    function render() {
        ctx.fillStyle = '#1e3c72'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Render World
        for (let x = 0; x < width; x++) {
            for (let y = 0; y < height; y++) {
                if (grid[x][y]) {
                    ctx.fillStyle = grid[x][y];
                    ctx.fillRect(x*cellSize, y*cellSize, cellSize+1, cellSize+1);
                }
            }
        }

        // Render Characters
        ctx.font = "24px serif";
        ctx.fillText(player.char, player.x, player.y + 20);
        ctx.fillText(partner.char, partner.x, partner.y + 20);

        update();
        requestAnimationFrame(render);
    }

    canvas.onmousedown = canvas.onmousemove = e => {
        if(e.buttons !== 1) return;
        let x = Math.floor(e.clientX/cellSize), y = Math.floor(e.clientY/cellSize);
        if(x>=0 && x<width && y>=0 && y<height) {
            let val = colors[currentElement][0];
            grid[x][y] = val;
            if(conn) conn.send({type: 'grid', x, y, v: val});
        }
    };

    function setEl(el) { currentElement = el; }
    function resetCanvas() { setup(); }
    window.onresize = setup;
    setup(); selectChar('🐱'); render();
</script>
</body>
</html>
